services:
  app:
    image: surkem-app:sec-0.2
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BACKEND_API_URL: http://backend:5000
    expose:
      - "3000"
    depends_on:
      - backend
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    restart: unless-stopped

  backend:
    image: surkem-backend:sec-0.2
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://surkem:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/surkem?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENCRYPTION_KEY_BASE64: ${ENCRYPTION_KEY_BASE64:?Set ENCRYPTION_KEY_BASE64 in .env}
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    user: "70:70"
    environment:
      POSTGRES_USER: surkem
      POSTGRES_DB: surkem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surkem -d surkem"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    restart: unless-stopped

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./security/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    internal: true

volumes:
  dbdata:
